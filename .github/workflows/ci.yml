name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]  # 운영 서버와 같은 메이저 (#206)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      - name: Lint (core)
        run: pnpm --filter @mytangerine/core lint
        continue-on-error: true

      - name: Build (core)
        run: pnpm --filter @mytangerine/core build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      - name: Test (core)
        run: pnpm --filter @mytangerine/core test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      - name: Lint (api)
        run: pnpm --filter @mytangerine/api lint
        continue-on-error: true

      - name: Build (api)
        run: pnpm --filter @mytangerine/api build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      - name: Test (api)
        run: pnpm --filter @mytangerine/api test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      # #251 신규 주문 알림(hermes) — 네트워크·DB 는 mock
      - name: Build (sync-service)
        run: pnpm --filter @mytangerine/sync-service build

      - name: Test (sync-service)
        run: pnpm --filter @mytangerine/sync-service test

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          fail_ci_if_error: false
          files: ./packages/core/coverage/coverage-final.json,./packages/api/coverage/coverage-final.json

  deploy-scripts:
    # 배포 스크립트 시험 (#201) — 임시 git 저장소 + 가짜 pnpm·pm2·curl 로 돌린다. 서버·secrets 를 쓰지 않는다
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Syntax check
        run: bash -n deploy/release-inplace.sh && bash -n deploy/ssh-deploy.sh

      - name: Test (deploy)
        run: python3 -m unittest discover -s deploy -v
