name: Deploy

# Release 발행 → 서버 제자리 배포 (#201 · 사용자 2026-11-17: Release 발행 = 배포 의지 · 별도 승인 없음).
# 러너는 저장소 코드를 checkout 하지 않는다 — ssh 로 "deploy <tag>" 한 줄만 보내고, 서버의 forced command
# (deploy/ssh-deploy.sh)가 deploy/release-inplace.sh 를 돌린다. 스키마·마이그레이션이 바뀐 태그는 그 스크립트가
# 바꾸기 전에 멈춘다(rc 1) — 이 job 이 실패로 끝나고 사람이 런북(docs/runbooks/auto-deploy.md)대로 한다.
# 실패 시 자동 롤백은 없다 — 판정 양식의 "되돌리기" 줄을 사람이 서버에서 실행한다.
# 이 저장소는 PUBLIC — Actions 로그는 누구나 본다. 서버가 돌려주는 것은 판정 양식뿐이고 접속 정보는 secrets(마스킹)에만 있다.
# secrets 는 environment "production" 에만: DEPLOY_SSH_KEY · DEPLOY_HOST · DEPLOY_USER · DEPLOY_KNOWN_HOSTS · DEPLOY_PORT(선택).
# environment 의 배포 대상은 태그 v* 로 제한한다(GitHub 설정 · 사용자).

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # prerelease 는 배포하지 않는다 — 마이그레이션 릴리즈처럼 손으로 배포하는 태그
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "태그 형식이 vX.Y.Z 가 아니다: $TAG"; exit 1; }

      - name: Deploy over ssh
        env:
          TAG: ${{ github.event.release.tag_name }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -o pipefail
          for v in KEY HOST SSH_USER KNOWN_HOSTS; do [[ -n "${!v}" ]] || { echo "secret 없음: $v"; exit 1; }; done
          trap 'rm -f ~/.ssh/deploy' EXIT
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$KEY" > ~/.ssh/deploy; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          rc=0
          # job timeout(30분) 전에 끊어 요약이 남게 한다 — 서버 쪽 배포는 끊겨도 끝까지 돈다(결과는 서버 원본 로그)
          timeout 1500 ssh -T -i ~/.ssh/deploy -p "${PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o LogLevel=ERROR \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$HOST" "deploy $TAG" 2>&1 | tee forms.txt || rc=$?
          case $rc in
            0) meaning="통과 또는 이미 배포됨" ;;
            1) meaning="바꾸기 전 중단 — 서비스 재시작 없음 (결과: 줄의 원인 해결 뒤 재실행)" ;;
            2) meaning="명령 거부 · 사용법 — forced command · 태그 형식 확인" ;;
            4) meaning="사람 개입 필요 — 판정 양식의 되돌리기 · 재시도 줄을 서버에서 실행" ;;
            124) meaning="시간 초과 — 서버 쪽 배포는 계속 돌았을 수 있다. 서버 원본 로그 확인" ;;
            255) meaning="ssh 연결 실패 — 호스트 · 포트 · 키 · known_hosts 확인" ;;
            *) meaning="알 수 없음" ;;
          esac
          {
            echo "## 배포 $TAG — rc $rc ($meaning)"
            echo '```text'
            cat forms.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
